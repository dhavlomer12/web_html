<html>
<center>
	<head>
	<title>  CSS filter property  </title>
	
		<style> 
		img   {
				width:300px;
				filter:grayscale(100%);
				transition:0.5s;
		}
		img:hover{ 
					filter: grayscale(10%)brightness(120%);
					
		}
		</style>
	</head>
	<body>
			<h2> CSS filter property </h2>
			<img src="4kwall.jpg" alt="4kwall" >
	</body>
</center>	
	
</html>
